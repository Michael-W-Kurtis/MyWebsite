# ---------------------------------------------------------------------------
# Reverse proxy for the personal site.
#
# nginx does three jobs here that the app should not do itself:
#   1. serve /static, /uploads and /results straight off disk
#   2. cap request bodies before a single byte reaches Python
#   3. rate-limit the expensive endpoints
# ---------------------------------------------------------------------------

# One shared zone for sort jobs. A sort is seconds of CPU, so it is the one thing
# on this site worth metering. 10 requests/minute with a burst of 5.
limit_req_zone $binary_remote_addr zone=sortzone:10m rate=10r/m;

# A batch is one POST followed by up to 16 cell GETs, so the sortzone rate would
# make a batch 429 itself. Batches get their own, slower zone for the submit and a
# generous one for the individual cells.
limit_req_zone $binary_remote_addr zone=batchzone:10m rate=4r/m;
limit_req_zone $binary_remote_addr zone=cellzone:10m rate=120r/m;
limit_req_status 429;

upstream site_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Must be at least as large as MAX_UPLOAD_BYTES in the app, or nginx rejects
    # the upload with a bare 413 before the app can return a readable message.
    client_max_body_size 14m;
    client_body_timeout 60s;

    # A single batch cell renders at the input's own resolution: ~27s at 6.4 MP and
    # ~95s at 22 MP. Keep these above BATCH_JOB_TIMEOUT or nginx drops the connection
    # while pixelsort is still working.
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # --- Static assets, served directly ---------------------------------
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Generated images. Named with a content hash, so they can be cached hard.
    location /results/ {
        alias /srv/data/results/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Uploads are user-supplied bytes. Force them to download rather than render
    # inline, so a crafted file cannot execute in the site's origin.
    location /uploads/ {
        alias /srv/data/UploadedImages/;
        access_log off;
        expires 1h;
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff" always;
        types { image/png png; image/jpeg jpg jpeg; }
        default_type application/octet-stream;
    }

    # Batch source images. Same treatment as uploads: user-supplied bytes.
    location /batches/ {
        alias /srv/data/batches/;
        access_log off;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        types { image/png png; }
        default_type application/octet-stream;
    }

    # Unity build assets. Proxied to the app rather than served from disk here,
    # because nginx cannot tell whether a given .unityweb is gzip or brotli and
    # guessing wrong is the classic "progress bar stops at 90%" bug. The app
    # reads the magic bytes and sets Content-Encoding correctly.
    #
    # proxy_buffering off matters: a Unity build runs to tens of megabytes and
    # buffering it would stage the whole thing through a temp file on the way past.
    location ~ ^/games/[^/]+/(build|assets)/ {
        proxy_pass http://site_app;
        include /etc/nginx/proxy_common.conf;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # Already-compressed payloads. Re-compressing wastes CPU and would
        # corrupt the Content-Encoding the app just set.
        gzip off;
        access_log off;
    }

    # Glitched PNGs are deliberately malformed. Never let a browser sniff them
    # into something executable, and always hand back the exact bytes on disk.
    location /glitches/ {
        alias /srv/data/glitches/;
        access_log off;
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        types { image/png png; }
        default_type application/octet-stream;
    }

    # --- Expensive endpoints --------------------------------------------
    location = /api/batch {
        limit_req zone=batchzone burst=2 nodelay;
        proxy_pass http://site_app;
        include /etc/nginx/proxy_common.conf;
    }

    location ~ ^/api/batch/ {
        limit_req zone=cellzone burst=20 nodelay;
        proxy_pass http://site_app;
        include /etc/nginx/proxy_common.conf;
    }

    location ~ ^/api/(sort|pixelsort-me|pnglitch)$ {
        limit_req zone=sortzone burst=5 nodelay;
        proxy_pass http://site_app;
        include /etc/nginx/proxy_common.conf;
    }

    # --- Everything else --------------------------------------------------
    location / {
        proxy_pass http://site_app;
        include /etc/nginx/proxy_common.conf;
    }
}
